services:
  api:
    build: .
    container_name: conduit-api
    environment:
      POSTGRES_HOST: postgres
      UVICORN_PORT: "8080"
    env_file:
      - .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/health-check"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - .:/conduit

  postgres:
    image: postgres:16
    container_name: conduit-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - .env
    ports:
      - ${POSTGRES_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $POSTGRES_DB -U $POSTGRES_USER"]
      interval: 10s
      timeout: 10s
      retries: 5
